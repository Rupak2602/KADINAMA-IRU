
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ff1717">
  <link rel="manifest" href="/manifest.json">
  <title>KADINAMA IRU</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #ff1717;
      font-family: Arial, sans-serif;
    }

    .splash-screen {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: #ff1717;
      animation: backgroundFade 0.6s ease-out both;
    }

    .splash-image {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center;
      opacity: 0;
      transform: scale(1.08);
      animation:
        imageReveal 1.1s ease-out 0.15s forwards,
        gentleZoom 2.8s ease-in-out 1.2s both;
    }

    .loading-indicator {
      position: absolute;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 50%;
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255, 255, 255, 0.35);
      border-top-color: #ffffff;
      border-radius: 50%;
      opacity: 0;
      transform: translateX(-50%);
      animation: spinnerReveal 0.4s ease 0.8s forwards, spin 0.8s linear infinite;
    }

    .splash-screen.leaving {
      animation: screenExit 0.55s ease-in forwards;
    }

    .splash-screen.leaving .splash-image {
      animation: imageExit 0.55s ease-in forwards;
    }

    @keyframes backgroundFade {
      from { background: #240000; }
      to { background: #ff1717; }
    }

    @keyframes imageReveal {
      from {
        opacity: 0;
        transform: scale(1.08);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes gentleZoom {
      from { transform: scale(1); }
      to { transform: scale(1.025); }
    }

    @keyframes spinnerReveal {
      to { opacity: 0.9; }
    }

    @keyframes spin {
      to { rotate: 360deg; }
    }

    @keyframes screenExit {
      to { opacity: 0; }
    }

    @keyframes imageExit {
      to {
        opacity: 0;
        transform: scale(1.04);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .splash-screen,
      .splash-image,
      .loading-indicator {
        animation-duration: 0.01ms !important;
        animation-delay: 0ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="splash-screen" id="splashScreen" aria-label="KADINAMA IRU introduction">
    <img
      class="splash-image"
      src="assets/images/kadinama-intro.png"
      alt="KADINAMA IRU"
      fetchpriority="high"
    >
    <div class="loading-indicator" aria-hidden="true"></div>
  </main>

  <script>
    "use strict";

    const splashScreen = document.getElementById("splashScreen");
    const splashImage = document.querySelector(".splash-image");

    let redirected = false;

    function openLogin() {
      if (redirected) return;
      redirected = true;

      splashScreen.classList.add("leaving");

      window.setTimeout(() => {
        window.location.replace("login.html");
      }, 550);
    }

    // Continue even if the image cannot load.
    splashImage.addEventListener("error", () => {
      console.error(
        "Intro image not found. Check assets/kadinama-intro.png."
      );
    });

    // Show the intro for approximately 3.5 seconds.
    window.setTimeout(openLogin, 3500);
  </script>
</body>
</html>
