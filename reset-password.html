
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf4">
  <title>Set New Password | KADINAMA IRU</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      background: #fffaf4;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-brand-mark {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      border-radius: 22px;
      background: #ff7048;
      color: #fff;
      font-size: 27px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(255, 112, 72, 0.22);
    }

    .auth-brand h1 {
      margin: 0;
      color: #29251f;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .auth-brand p {
      margin: 9px 0 0;
      color: #898176;
      font-size: 14px;
    }

    .auth-card {
      padding: 30px 26px;
      border: 1px solid #f0e7dc;
      border-radius: 25px;
      background: #fff;
      box-shadow: 0 16px 45px rgba(70, 48, 25, 0.07);
    }

    .auth-card h2 {
      margin: 0 0 10px;
      color: #29251f;
      font-size: 25px;
      letter-spacing: -0.7px;
    }

    .auth-description {
      margin: 0 0 25px;
      color: #8b8379;
      font-size: 14px;
      line-height: 1.7;
    }

    .auth-form-group {
      margin-bottom: 19px;
    }

    .auth-form-group label {
      display: block;
      margin-bottom: 8px;
      color: #403a32;
      font-size: 13px;
      font-weight: 700;
    }

    .auth-input-wrap {
      position: relative;
    }

    .auth-input {
      display: block;
      width: 100%;
      min-height: 49px;
      padding: 13px 14px;
      border: 1px solid #e9e0d5;
      border-radius: 13px;
      outline: none;
      background: #fffdfb;
      color: #29251f;
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-input:focus {
      border-color: #ff7048;
      box-shadow: 0 0 0 3px rgba(255, 112, 72, 0.12);
    }

    .auth-input::placeholder {
      color: #b0a79c;
    }

    .auth-password {
      padding-right: 72px;
    }

    .auth-toggle-password {
      position: absolute;
      top: 50%;
      right: 13px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #e66b47;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .auth-submit {
      width: 100%;
      min-height: 50px;
      margin-top: 4px;
      border: 0;
      border-radius: 14px;
      background: #ff7048;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(255, 112, 72, 0.19);
      transition: transform 0.2s, background 0.2s;
    }

    .auth-submit:hover {
      transform: translateY(-2px);
      background: #f5623a;
    }

    .auth-submit:disabled {
      cursor: wait;
      opacity: 0.7;
      transform: none;
    }

    .auth-message {
      display: none;
      margin-bottom: 17px;
      padding: 12px 13px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .auth-message.error {
      display: block;
      background: #fff0ed;
      color: #b83d2b;
    }

    .auth-message.success {
      display: block;
      background: #edf8ef;
      color: #26753b;
    }

    .auth-footer {
      margin: 24px 0 0;
      text-align: center;
      color: #81786e;
      font-size: 13px;
    }

    .auth-link {
      color: #e66b47;
      text-decoration: none;
      font-weight: 700;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    @media (max-width: 420px) {
      .auth-card {
        padding: 25px 20px;
      }

      .auth-brand h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="auth-page">
    <div class="auth-container">

      <header class="auth-brand">
        <div class="auth-brand-mark">K</div>
        <h1>KADINAMA IRU</h1>
        <p>Your daily nutrition companion</p>
      </header>

      <section class="auth-card">
        <h2>Set a new password</h2>

        <p class="auth-description">
          Choose a strong new password for your account.
        </p>

        <div
          id="authMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></div>

        <form id="resetPasswordForm">
          <div class="auth-form-group">
            <label for="newPassword">New password</label>

            <div class="auth-input-wrap">
              <input
                class="auth-input auth-password"
                type="password"
                id="newPassword"
                autocomplete="new-password"
                placeholder="At least 8 characters"
                minlength="8"
                required
              >

              <button
                class="auth-toggle-password"
                type="button"
                id="toggleNewPassword"
              >Show</button>
            </div>
          </div>

          <div class="auth-form-group">
            <label for="confirmPassword">Confirm new password</label>

            <div class="auth-input-wrap">
              <input
                class="auth-input auth-password"
                type="password"
                id="confirmPassword"
                autocomplete="new-password"
                placeholder="Enter password again"
                minlength="8"
                required
              >

              <button
                class="auth-toggle-password"
                type="button"
                id="toggleConfirmPassword"
              >Show</button>
            </div>
          </div>

          <button
            class="auth-submit"
            type="submit"
            id="resetPasswordButton"
            disabled
          >Verify reset link...</button>
        </form>

        <p class="auth-footer">
          Remember your password?
          <a class="auth-link" href="login.html">Sign in</a>
        </p>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>

  <script>
    "use strict";

    const resetForm = document.getElementById("resetPasswordForm");
    const resetButton = document.getElementById("resetPasswordButton");
    const authMessage = document.getElementById("authMessage");

    let recoveryReady = false;
    let recoverySubscription = null;

    function showMessage(message, type = "error") {
      authMessage.textContent = message;
      authMessage.className = "auth-message " + type;
    }

    function setupPasswordToggle(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);

      button.addEventListener("click", function () {
        const visible = input.type === "password";

        input.type = visible ? "text" : "password";
        button.textContent = visible ? "Hide" : "Show";
      });
    }

    setupPasswordToggle("newPassword", "toggleNewPassword");
    setupPasswordToggle("confirmPassword", "toggleConfirmPassword");

    async function initializeRecovery() {
      const client = window.supabaseClient;

      if (!client) {
        showMessage(
          "Supabase connection is unavailable. Check your configuration."
        );
        resetButton.textContent = "Reset Unavailable";
        return;
      }

      // Wait for the recovery event generated by the email link.
      const { data } = client.auth.onAuthStateChange(
        async function (event, session) {
          if (event === "PASSWORD_RECOVERY" && session) {
            recoveryReady = true;
            resetButton.disabled = false;
            resetButton.textContent = "Update Password";
            showMessage(
              "Reset link verified. You can now choose a new password.",
              "success"
            );
          }
        }
      );

      recoverySubscription = data.subscription;

      // Also support a valid recovery session already restored by Supabase.
      const { data: sessionData, error } = await client.auth.getSession();

      if (!error && sessionData.session && !recoveryReady) {
        // A normal login session is not enough to prove a reset request.
        // The recovery event above is required for this page.
      }

      if (!recoveryReady) {
        resetButton.disabled = true;
        resetButton.textContent = "Verify reset link...";

        showMessage(
          "Open this page using the latest password reset link sent to your email. If the link expired, request another one.",
          "error"
        );
      }
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      if (!recoveryReady || !window.supabaseClient) {
        showMessage(
          "Your password reset link has not been verified. Open the latest link from your email."
        );
        return;
      }

      const newPassword = document.getElementById("newPassword").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (newPassword.length < 8) {
        showMessage("Your password must contain at least 8 characters.");
        return;
      }

      if (newPassword !== confirmPassword) {
        showMessage("The passwords do not match.");
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Updating password...";

      try {
        const { error } = await window.supabaseClient.auth.updateUser({
          password: newPassword
        });

        if (error) throw error;

        showMessage(
          "Your password has been updated. You can now sign in with your new password.",
          "success"
        );

        resetForm.reset();

        // End the recovery session after a successful password change.
        await window.supabaseClient.auth.signOut();

        window.setTimeout(function () {
          window.location.replace("login.html");
        }, 1800);

      } catch (error) {
        showMessage(
          error.message || "Unable to update your password. Request a new reset link and try again."
        );

        resetButton.disabled = false;
        resetButton.textContent = "Update Password";
      }
    });

    initializeRecovery();

    window.addEventListener("beforeunload", function () {
      if (recoverySubscription) {
        recoverySubscription.unsubscribe();
      }
    });
  </script>
</body>
</html>
