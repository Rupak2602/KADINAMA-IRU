
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf4">
  <title>Reset Password | KADINAMA IRU</title>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      background: #fffaf4;
    }

    .auth-container {
      width: 100%;
      max-width: 420px;
      margin: auto;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .auth-brand-mark {
      width: 62px;
      height: 62px;
      display: grid;
      place-items: center;
      margin: 0 auto 15px;
      border-radius: 22px;
      background: #ff7048;
      color: #fff;
      font-size: 27px;
      font-weight: 800;
      box-shadow: 0 10px 25px rgba(255, 112, 72, 0.22);
    }

    .auth-brand h1 {
      margin: 0;
      color: #29251f;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .auth-brand p {
      margin: 9px 0 0;
      color: #898176;
      font-size: 14px;
    }

    .auth-card {
      padding: 30px 26px;
      border: 1px solid #f0e7dc;
      border-radius: 25px;
      background: #fff;
      box-shadow: 0 16px 45px rgba(70, 48, 25, 0.07);
    }

    .auth-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      margin-bottom: 20px;
      border-radius: 17px;
      background: #fff0e8;
      color: #f16e46;
      font-size: 24px;
    }

    .auth-card h2 {
      margin: 0 0 10px;
      color: #29251f;
      font-size: 25px;
      letter-spacing: -0.7px;
    }

    .auth-description {
      margin: 0 0 25px;
      color: #8b8379;
      font-size: 14px;
      line-height: 1.7;
    }

    .auth-form-group {
      margin-bottom: 20px;
    }

    .auth-form-group label {
      display: block;
      margin-bottom: 8px;
      color: #403a32;
      font-size: 13px;
      font-weight: 700;
    }

    .auth-input {
      display: block;
      width: 100%;
      min-height: 50px;
      padding: 13px 14px;
      border: 1px solid #e9e0d5;
      border-radius: 13px;
      outline: none;
      background: #fffdfb;
      color: #29251f;
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-input:focus {
      border-color: #ff7048;
      box-shadow: 0 0 0 3px rgba(255, 112, 72, 0.12);
    }

    .auth-input::placeholder {
      color: #b0a79c;
    }

    .auth-submit {
      width: 100%;
      min-height: 50px;
      border: 0;
      border-radius: 14px;
      background: #ff7048;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(255, 112, 72, 0.19);
      transition: transform 0.2s, background 0.2s;
    }

    .auth-submit:hover {
      transform: translateY(-2px);
      background: #f5623a;
    }

    .auth-submit:disabled {
      cursor: wait;
      opacity: 0.7;
      transform: none;
    }

    .auth-message {
      display: none;
      margin-bottom: 17px;
      padding: 12px 13px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .auth-message.error {
      display: block;
      background: #fff0ed;
      color: #b83d2b;
    }

    .auth-message.success {
      display: block;
      background: #edf8ef;
      color: #26753b;
    }

    .auth-footer {
      margin: 24px 0 0;
      text-align: center;
      color: #81786e;
      font-size: 13px;
    }

    .auth-link {
      color: #e66b47;
      text-decoration: none;
      font-weight: 700;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    .auth-back {
      display: block;
      margin-top: 22px;
      text-align: center;
      color: #837a70;
      text-decoration: none;
      font-size: 12px;
    }

    .auth-back:hover {
      color: #e66b47;
    }

    @media (max-width: 420px) {
      .auth-card {
        padding: 25px 20px;
      }

      .auth-brand h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="auth-page">
    <div class="auth-container">

      <header class="auth-brand">
        <div class="auth-brand-mark">K</div>
        <h1>KADINAMA IRU</h1>
        <p>Your daily nutrition companion</p>
      </header>

      <section class="auth-card">
        <div class="auth-icon" aria-hidden="true">&#9993;</div>

        <h2>Forgot password?</h2>

        <p class="auth-description">
          No worries! Enter your registered email address and we will send
          you a link to reset your password.
        </p>

        <div
          id="authMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></div>

        <form id="resetForm">
          <div class="auth-form-group">
            <label for="email">Email address</label>

            <input
              class="auth-input"
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>

          <button
            class="auth-submit"
            type="submit"
            id="resetButton"
          >
            Send Reset Link
          </button>
        </form>

        <p class="auth-footer">
          Remember your password?
          <a class="auth-link" href="login.html">Back to sign in</a>
        </p>
      </section>

      <a class="auth-back" href="index.html">
        &larr; Back to home
      </a>

    </div>
  </main>

  <!-- Supabase connection -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>

  <script>
    "use strict";

    const resetForm = document.getElementById("resetForm");
    const resetButton = document.getElementById("resetButton");
    const authMessage = document.getElementById("authMessage");

    function showMessage(message, type = "error") {
      authMessage.textContent = message;
      authMessage.className = "auth-message " + type;
    }

    resetForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      authMessage.className = "auth-message";
      authMessage.textContent = "";

      const email = document.getElementById("email").value.trim();

      if (!window.supabaseClient) {
        showMessage(
          "Supabase is not connected. Check js/config.js and the browser console."
        );
        return;
      }

      resetButton.disabled = true;
      resetButton.textContent = "Sending link...";

      try {
        const { error } =
          await window.supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: window.location.origin + "/reset-password.html"
          });

        if (error) throw error;

        showMessage(
          "If an account exists for this email, a reset link will be sent. Please check your inbox and spam folder.",
          "success"
        );

      } catch (error) {
        showMessage(
          error.message || "Unable to send the reset link. Please try again."
        );
      } finally {
        resetButton.disabled = false;
        resetButton.textContent = "Send Reset Link";
      }
    });
  </script>
</body>
</html>
