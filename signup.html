
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fffaf4">
  <title>Create Account | KADINAMA IRU</title>

  <link
  href="https://fonts.googleapis.com/css2?family=Arima:wght@700;800&display=swap"
  rel="stylesheet"
>

  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
 

  <style>
    .auth-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 18px;
      background: #fffaf4;
    }

    .auth-container {
      width: 100%;
      max-width: 430px;
      margin: auto;
    }

    .auth-brand {
      text-align: center;
      margin-bottom: 27px;
    }

  .auth-brand-mark {
  width: 72px;
  height: 72px;
  margin: 0 auto 12px;
  flex-shrink: 0;
  overflow: hidden;
  border-radius: 20px;
  background: #ff7048;
}

.auth-brand-mark img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  border-radius: inherit;
}

    .auth-brand h1 {
      margin: 0;
      color: #29251f;
      font-size: 25px;
      font-weight: 800;
      letter-spacing: -0.8px;
    }

    .auth-brand p {
      margin: 8px 0 0;
      color: #898176;
      font-size: 14px;
    }

    .auth-card {
      padding: 29px 26px;
      border: 1px solid #f0e7dc;
      border-radius: 25px;
      background: #fff;
      box-shadow: 0 16px 45px rgba(70, 48, 25, 0.07);
    }

    .auth-card h2 {
      margin: 0 0 8px;
      color: #29251f;
      font-size: 25px;
      letter-spacing: -0.7px;
    }

    .auth-description {
      margin: 0 0 23px;
      color: #8b8379;
      font-size: 14px;
      line-height: 1.6;
    }

    .auth-form-group {
      margin-bottom: 17px;
    }

    .auth-form-group label {
      display: block;
      margin-bottom: 8px;
      color: #403a32;
      font-size: 13px;
      font-weight: 700;
    }

    .auth-input-wrap {
      position: relative;
    }

    .auth-input {
      display: block;
      width: 100%;
      min-height: 48px;
      padding: 12px 14px;
      border: 1px solid #e9e0d5;
      border-radius: 13px;
      outline: none;
      background: #fffdfb;
      color: #29251f;
      font: inherit;
      font-size: 14px;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .auth-input:focus {
      border-color: #ff7048;
      box-shadow: 0 0 0 3px rgba(255, 112, 72, 0.12);
    }

    .auth-input::placeholder {
      color: #b0a79c;
    }

    .auth-password {
      padding-right: 72px;
    }

    .auth-toggle-password {
      position: absolute;
      top: 50%;
      right: 13px;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #e66b47;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .auth-submit {
      width: 100%;
      min-height: 50px;
      margin-top: 5px;
      border: 0;
      border-radius: 14px;
      background: #ff7048;
      color: #fff;
      cursor: pointer;
      font: inherit;
      font-size: 14px;
      font-weight: 800;
      box-shadow: 0 8px 18px rgba(255, 112, 72, 0.19);
      transition: transform 0.2s, background 0.2s;
    }

    .auth-submit:hover {
      transform: translateY(-2px);
      background: #f5623a;
    }

    .auth-submit:disabled {
      cursor: wait;
      opacity: 0.7;
      transform: none;
    }

    .auth-message {
      display: none;
      margin-bottom: 17px;
      padding: 12px 13px;
      border-radius: 11px;
      font-size: 13px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .auth-message.error {
      display: block;
      background: #fff0ed;
      color: #b83d2b;
    }

    .auth-message.success {
      display: block;
      background: #edf8ef;
      color: #26753b;
    }

    .auth-terms {
      margin: 17px 0 0;
      color: #92887d;
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    .auth-footer {
      margin: 22px 0 0;
      text-align: center;
      color: #81786e;
      font-size: 13px;
    }

    .auth-link {
      color: #e66b47;
      text-decoration: none;
      font-weight: 700;
    }

    .auth-link:hover {
      text-decoration: underline;
    }

    .auth-back {
      display: block;
      margin-top: 21px;
      text-align: center;
      color: #837a70;
      text-decoration: none;
      font-size: 12px;
    }

    .auth-back:hover {
      color: #e66b47;
    }

    @media (max-width: 420px) {
      .auth-card {
        padding: 24px 20px;
      }

      .auth-brand h1 {
        font-size: 23px;
      }

      
.brand-tamil {
  font-family: "Catamaran", sans-serif;
  font-size: 32px;
  font-weight: 800;
  letter-spacing: 0;
  line-height: 1.5;
  color: #151b30;
  text-align: center;
  margin: 0;
}

    }
  </style>
</head>

<body>
  <main class="auth-page">
    <div class="auth-container">

      <header class="auth-brand">
        <div class="auth-brand-mark">
  <img src="assets/images/kadinama-logo.png" alt="KADINAMA IRU Logo">
</div>
        <h1 class="brand-tamil">கடினமா இரு</h1>
        <p>Your daily nutrition companion</p>
      </header>

      <section class="auth-card">
        <h2>Create your account</h2>

        <p class="auth-description">
          Start building healthier habits, one day at a time.
        </p>

        <div
          id="authMessage"
          class="auth-message"
          role="status"
          aria-live="polite"
        ></div>

        <form id="signupForm">
          <div class="auth-form-group">
            <label for="fullName">Full name</label>
            <input
              class="auth-input"
              type="text"
              id="fullName"
              name="fullName"
              placeholder="Enter your full name"
              autocomplete="name"
              maxlength="80"
              required
            >
          </div>

          <div class="auth-form-group">
            <label for="email">Email address</label>
            <input
              class="auth-input"
              type="email"
              id="email"
              name="email"
              placeholder="you@example.com"
              autocomplete="email"
              required
            >
          </div>

          <div class="auth-form-group">
            <label for="password">Create password</label>

            <div class="auth-input-wrap">
              <input
                class="auth-input auth-password"
                type="password"
                id="password"
                name="password"
                placeholder="At least 8 characters"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                class="auth-toggle-password"
                type="button"
                id="togglePassword"
              >Show</button>
            </div>
          </div>

          <div class="auth-form-group">
            <label for="confirmPassword">Confirm password</label>

            <div class="auth-input-wrap">
              <input
                class="auth-input auth-password"
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Enter password again"
                autocomplete="new-password"
                minlength="8"
                required
              >

              <button
                class="auth-toggle-password"
                type="button"
                id="toggleConfirmPassword"
              >Show</button>
            </div>
          </div>

          <button class="auth-submit" type="submit" id="signupButton">
            Create Account
          </button>

          <p class="auth-terms">
            By creating an account, you agree to use KADINAMA IRU responsibly.
          </p>
        </form>

        <p class="auth-footer">
          Already have an account?
          <a class="auth-link" href="login.html">Sign in</a>
        </p>
      </section>

      <a class="auth-back" href="index.html">
        &larr; Back to home
      </a>

    </div>
  </main>

  <!-- Supabase connection -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/supabase-client.js"></script>
  <script src="js/auth.js"></script>

  <script>
    "use strict";

    const signupForm = document.getElementById("signupForm");
    const signupButton = document.getElementById("signupButton");
    const authMessage = document.getElementById("authMessage");

    function showMessage(message, type = "error") {
      authMessage.textContent = message;
      authMessage.className = "auth-message " + type;
    }

    function setupPasswordToggle(inputId, buttonId) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);

      button.addEventListener("click", function () {
        const showPassword = input.type === "password";

        input.type = showPassword ? "text" : "password";
        button.textContent = showPassword ? "Hide" : "Show";

        button.setAttribute(
          "aria-label",
          showPassword ? "Hide password" : "Show password"
        );
      });
    }

    setupPasswordToggle("password", "togglePassword");
    setupPasswordToggle("confirmPassword", "toggleConfirmPassword");

    // Redirect users who already have an active session.
    (async function checkExistingSession() {
      if (window.KadinamaAuth) {
        await window.KadinamaAuth.redirectIfAuthenticated("dashboard.html");
      }
    })();

    signupForm.addEventListener("submit", async function (event) {
      event.preventDefault();

      authMessage.className = "auth-message";
      authMessage.textContent = "";

      const fullName = document.getElementById("fullName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;
      const confirmPassword =
        document.getElementById("confirmPassword").value;

      if (!fullName) {
        showMessage("Please enter your full name.");
        return;
      }

      if (password.length < 8) {
        showMessage("Your password must contain at least 8 characters.");
        return;
      }

      if (password !== confirmPassword) {
        showMessage("The passwords do not match.");
        return;
      }

      if (!window.supabaseClient) {
        showMessage(
          "Supabase is not connected. Check js/config.js and the browser console."
        );
        return;
      }

      signupButton.disabled = true;
      signupButton.textContent = "Creating account...";

      try {
        const { data, error } =
          await window.supabaseClient.auth.signUp({
            email: email,
            password: password,
            options: {
              data: {
                full_name: fullName
              },
              emailRedirectTo: window.location.origin + "/login.html"
            }
          });

        if (error) throw error;

        if (data.session) {
          showMessage(
            "Your account has been created successfully. Opening your dashboard...",
            "success"
          );

          window.location.replace("dashboard.html");
          return;
        }

        showMessage(
          "Your signup request was received. If email confirmation is enabled, check your inbox to verify your account before signing in.",
          "success"
        );

        signupForm.reset();

      } catch (error) {
        showMessage(
          error.message || "Unable to create your account. Please try again."
        );
      } finally {
        signupButton.disabled = false;
        signupButton.textContent = "Create Account";
      }
    });
  </script>
</body>
</html>
